<!doctype html><meta name=viewport content='width=device-width'><title>ZRP-6</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef1f5;font:15px system-ui,sans-serif;color:#101828}form{background:#fff;border-radius:14px;padding:28px;width:300px;box-shadow:0 8px 30px #0002}p{color:#5f6b7f}input,button{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:9px;font:inherit;border:1px solid #ccd;border-radius:8px}button{background:#2f6fd0;color:#fff;border:0;font-weight:600}</style><form onsubmit='u();return false'><h3>ZRP-6</h3><p>The web page is not installed. Log in and choose build/zrp6-ui.bin.</p><input id=n placeholder=Username required><input id=p type=password placeholder=Password required><input id=f type=file required><button>Install page</button><p id=m></p></form><script>function u(){var g=function(i){return document.getElementById(i)},m=g('m');m.textContent='Uploading...';fetch('/ui',{method:'POST',body:g('f').files[0],headers:{Authorization:'Basic '+btoa(g('n').value+':'+g('p').value)}}).then(function(r){return r.status==401?'Wrong username or password.':r.text()}).then(function(t){m.textContent=t;if(/installed/.test(t))setTimeout(function(){location.reload()},1500)})}</script>
