# OpenOCD config for the RTI ZRP-6 (uPSD3434EV), via a NUCLEO-G474RE running
# firmware/stm32g474_rbb and bridged to TCP by tools/rbb_bridge.py.
#
#   cd firmware/stm32g474_rbb && make flash
#   python3 tools/rbb_bridge.py --dev /dev/cu.usbmodem1203 --once &
#   openocd -f tools/openocd/zrp6.cfg
#
# Everything below was MEASURED on hardware 2026-09-09, not guessed:
#
#   2 TAPs in the chain      (all-BYPASS delay = 2 clocks)
#   total IR length 10       (zeros flushed, then 1s counted through)
#   IR capture 0b1000010000  -> the IEEE-mandated '01' appears at bit 0 AND at
#                               bit 5, so it is two 5-bit IRs, not one of 10
#   TAP nearest TDO: no IDCODE register, so it sits in BYPASS after reset and
#                    contributes the single leading bit that made a naive
#                    32-bit read return 0x30280082 (= 0x18140041 << 1)
#   TAP behind it:   IDCODE 0x18140041
#                    mfg 0x020 (STMicroelectronics), part 0x8140, ver 0x1
#
# The identity of the first TAP is not established. It is BYPASS-only, so it
# does not obstruct anything as long as it is declared.
#
# Declaration order is TDO-first, confirmed by testing both ways: with this
# order OpenOCD attributes the IDCODE to upsd.tap; reversed, it attributes it
# to the wrong one.

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 4242

transport select jtag
adapter speed 100

jtag newtap bypass tap -irlen 5 -ircapture 0x01 -irmask 0x03
jtag newtap upsd   tap -irlen 5 -ircapture 0x01 -irmask 0x03 -expected-id 0x18140041

init


# zrp6_run.cfg -- same chain as zrp6.cfg but it stays up after init so an
# `svf` command can be handed in with -c.  Play SVFs WITHOUT -tap: PSDsoft
# already emits HIR 5 / HDR 1 for the uPSD's second (MCU) TAP, and -tap would
# add the same padding a second time.
